<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cash Counter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="box">
<h2>Money Counting Calculator</h2> 

<div class="money">

<div class="row">
  <img src ="500.jpg" alt="₹500 Note"> <h2>×</h2>
  <input type="number" id="n500" value="0" min="0">
</div>

<div class="row">
  <img src ="200.jpg" alt="₹200 Note"> <h2>×</h2>
  <input type="number" id="n200" value="0" min="0">
</div>

<div class="row">
  <img src ="100.jpg" alt="₹100 Note"> <h2>×</h2>
  <input type="number" id="n100" value="0" min="0">
</div>

<div class="row">
  <img src = "50.jpg" alt="₹50 Note"> <h2>×</h2>
  <input type="number" id="n50" value="0" min="0">
</div>

<div class="row">
  <img src ="20.jpg" alt="₹20 Note"> <h2>×</h2>
  <input type="number" id="n20" value="0" min="0">
</div>

<div class="row">
  <img src ="10.jpg" alt="₹10 Note"> <h2>×</h2>
  <input type="number" id="n10" value="0" min="0">
</div>

<button onclick="calculate()">Calculate Total</button>
<div class="result" id="result">Total Amount = 0 /-</div>
</div>

</div> <!-- End money div-->

<script src="text.js"></script>
</body>
</html>
